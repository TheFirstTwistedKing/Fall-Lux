<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#120b06">
<title>Fall-Lux</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23120b06'/%3E%3Cpath d='M26 4 9 23' stroke='%23e9b04c' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='9' cy='23' r='3' fill='%23fff3d6'/%3E%3C/svg%3E">
<style>
@font-face{font-family:"Song Myung";src:url("fonts/SongMyung.woff2") format("woff2");font-display:block}
@font-face{font-family:"IM Fell English";src:url("fonts/IMFellEnglish.woff2") format("woff2");font-display:block}

:root{
  --ink:#f1e3bf;          /* 빛바랜 종이 위 잉크 */
  --ink-dim:rgba(241,227,191,.46);
  --ink-faint:rgba(241,227,191,.36);
  --ember:#e9b04c;        /* 강조: 혜성의 노랑 */
  --night:#120b06;
  --u:8px;                /* 간격 기본 단위 */
  --serif:"Song Myung","Nanum Myeongjo",serif;
  --latin:"IM Fell English","Song Myung",serif;
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--night);overflow:hidden;overscroll-behavior:none}
body{color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
button:focus{outline:none}
button:focus-visible{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.3em}

/* ── 캠코더: 이 안의 모든 것이 손에 들린 카메라로 찍힌다 ── */
#camera{position:fixed;inset:0;overflow:hidden}
#fx{position:absolute;inset:0;width:100%;height:100%;display:block}
/* 글자 층: 하늘과 같은 값으로 흔들린다 (하늘은 캔버스 안에서 흔든다) */
#stage{position:absolute;inset:0;transform-origin:50% 50%;will-change:transform}

/* 렌즈 위에 얹히는 것들: 카메라와 함께 움직이지 않는다 */
.lens{position:fixed;inset:0;pointer-events:none}
#vignette{background:radial-gradient(120% 95% at 50% 46%,transparent 52%,rgba(10,5,2,.55) 82%,rgba(6,3,1,.9) 100%)}
#grain{opacity:.055;background-size:160px 160px;animation:grain 1s steps(6) infinite}
@keyframes grain{0%{background-position:0 0}17%{background-position:-37px 21px}33%{background-position:52px -44px}
  50%{background-position:-18px 63px}67%{background-position:71px 9px}83%{background-position:-60px -30px}100%{background-position:0 0}}
#blackout{background:#000;opacity:0;transition:opacity 1.6s ease}
body.blank #blackout{opacity:1;pointer-events:auto}

/* ── 화면 ── */
.screen{position:absolute;inset:0;padding:calc(var(--u)*6 + var(--safe-t)) calc(var(--u)*3 + var(--safe-r)) calc(var(--u)*6 + var(--safe-b)) calc(var(--u)*3 + var(--safe-l));
  opacity:0;visibility:hidden;filter:blur(10px);transform:scale(1.03);
  transition:opacity .9s ease,filter .9s ease,transform 1.1s cubic-bezier(.2,.7,.2,1),visibility 0s linear .9s}
.screen.on{opacity:1;visibility:visible;filter:blur(0);transform:none;
  transition:opacity .9s ease .15s,filter .9s ease .15s,transform 1.1s cubic-bezier(.2,.7,.2,1) .15s,visibility 0s}
/* 세계관·설정 글자 뒤의 테두리 없는 그늘: 노란 하늘 위에서도 읽히게 */
#lore::before,#settings::before{content:"";position:absolute;inset:-10%;pointer-events:none;
  background:linear-gradient(90deg,rgba(14,8,3,.72) 0%,rgba(14,8,3,.5) 45%,rgba(14,8,3,0) 80%)}
@media (max-width:560px){#lore::before,#settings::before{background:rgba(14,8,3,.55)}}
.page{position:relative}
.ink{filter:url(#ink);text-shadow:0 0 1px rgba(255,236,190,.6),0 0 22px rgba(233,176,76,.22),0 2px 0 rgba(40,20,6,.35)}

/* 메인: 왼쪽 아래 세로 목록. 가장 큰 것은 '시작' 하나 */
#main{display:flex;flex-direction:column;justify-content:flex-end}
#main::before{content:"";position:absolute;inset:-10%;pointer-events:none;
  background:radial-gradient(70% 55% at 12% 88%,rgba(14,8,3,.55),rgba(14,8,3,0) 70%)}
.menu{position:relative}
.menu{display:flex;flex-direction:column;align-items:flex-start;gap:calc(var(--u)*1.5);will-change:transform;
  padding-left:clamp(0px,6vw,96px);padding-bottom:clamp(16px,8vh,96px)}
.menu button{display:block;min-height:48px;line-height:1;letter-spacing:.14em;color:var(--ink);
  transition:color .4s ease,letter-spacing .6s cubic-bezier(.2,.7,.2,1),opacity .4s}
.menu .primary{font-size:clamp(56px,11vw,120px);letter-spacing:.18em}
.menu .sub{font-size:clamp(26px,4.4vw,44px);color:var(--ink-dim)}
.menu button:hover,.menu button:focus-visible{letter-spacing:.26em;color:var(--ink);text-decoration:none}
.menu .primary:hover{color:#fff3d6}
.mark{position:fixed;right:calc(var(--u)*3 + var(--safe-r));bottom:calc(var(--u)*3 + var(--safe-b));
  font-family:var(--latin);font-size:14px;letter-spacing:.12em;color:var(--ink-faint);transition:opacity .6s}
body:not(.home) .mark{opacity:0}

/* 글자 하나씩 잉크가 번지며 나타난다 */
.ch{display:inline-block;opacity:0;filter:blur(6px);transform:translateY(.12em);
  animation:inkin .9s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i) * var(--step,70ms) + var(--base,0ms))}
.ch.sp{width:.32em}
@keyframes inkin{60%{opacity:.85;filter:blur(1.2px)}100%{opacity:1;filter:blur(0);transform:none}}

/* 세계관 / 설정: 테두리 없는 글자만의 화면 */
.page{max-width:760px;margin-left:clamp(0px,6vw,96px);height:100%;display:flex;flex-direction:column}
.page h2{font-weight:400;font-size:clamp(34px,6vw,56px);letter-spacing:.16em;margin-bottom:calc(var(--u)*4)}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-right:var(--u);
  mask-image:linear-gradient(#000 85%,transparent);-webkit-mask-image:linear-gradient(#000 85%,transparent);scrollbar-width:none;user-select:text;-webkit-user-select:text}
.scroll::-webkit-scrollbar{display:none}
.back{margin-top:calc(var(--u)*3);min-height:48px;font-size:20px;letter-spacing:.2em;color:var(--ink-dim);align-self:flex-start}
.back:hover{color:var(--ink)}
.empty{font-size:20px;line-height:1.9;color:var(--ink-dim);letter-spacing:.06em}

.entry{margin-bottom:calc(var(--u)*5)}
.entry h3{font-weight:400;font-size:24px;letter-spacing:.08em;margin-bottom:var(--u);word-break:keep-all}
.entry .alias{font-size:16px;color:var(--ember);letter-spacing:.1em;margin-bottom:calc(var(--u)*1.5)}
.entry p{font-size:18px;line-height:1.95;color:rgba(241,227,191,.82);margin-bottom:var(--u);word-break:keep-all}

.group{margin-bottom:calc(var(--u)*5)}
.group h4{font-family:var(--latin);font-weight:400;font-size:15px;letter-spacing:.24em;color:var(--ember);margin-bottom:calc(var(--u)*2);text-transform:uppercase}
.row{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--u) calc(var(--u)*3);margin-bottom:calc(var(--u)*1.5)}
.row .label{font-size:20px;min-width:7.5em;letter-spacing:.08em}
.opt{min-height:44px;font-size:19px;letter-spacing:.1em;color:var(--ink-faint);transition:color .3s}
.opt:hover{color:var(--ink-dim)}
.opt[aria-pressed="true"]{color:var(--ink)}
.opt[aria-pressed="true"]::before{content:"— "}
.planet{margin-bottom:calc(var(--u)*2.5)}
.planet .pname{font-size:20px;letter-spacing:.08em}
.planet .pnum{font-family:var(--latin);color:var(--ink-dim);margin-right:var(--u)}
.planet .tl{font-size:16px;color:var(--ink-dim);line-height:1.8;padding-left:calc(var(--u)*4)}
.planet .tl button{color:var(--ink-faint);font-size:15px;min-height:36px;margin-left:var(--u)}
.planet .tl button:hover{color:var(--ink)}
.notice{margin-bottom:calc(var(--u)*4)}
.notice h5{font-family:var(--latin);font-weight:400;font-size:20px;letter-spacing:.08em;color:var(--ink)}
.notice time{display:block;font-family:var(--latin);font-size:14px;color:var(--ink-faint);margin:4px 0 var(--u)}
.notice li{list-style:none;font-size:17px;line-height:1.85;color:rgba(241,227,191,.78);word-break:keep-all;padding-left:1em;text-indent:-1em}
.notice li::before{content:"· ";color:var(--ember)}

@media (max-width:560px){
  .menu{padding-left:var(--u)}
  .page{margin-left:0}
  .row .label{min-width:100%}
  .mark{font-size:12px}
}
@media (max-height:460px){.menu .primary{font-size:52px}.menu{padding-bottom:var(--u)}}
</style>
</head>
<body class="home">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="ink" x="-5%" y="-20%" width="110%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G" result="d"/>
    <feGaussianBlur in="d" stdDeviation="0.35"/>
  </filter>
</svg>

<div id="camera">
  <canvas id="fx"></canvas>
  <div id="stage">

  <section class="screen" id="main" aria-label="메인">
    <nav class="menu">
      <button class="primary ink" data-go="start" data-text="시작"></button>
      <button class="sub ink" data-go="lore" data-text="세계관"></button>
      <button class="sub ink" data-go="settings" data-text="설정"></button>
    </nav>
  </section>

  <section class="screen" id="lore" aria-label="세계관">
    <div class="page">
      <h2 class="ink" data-text="세계관"></h2>
      <div class="scroll" id="loreList"></div>
      <button class="back ink" data-go="main">돌아가기</button>
    </div>
  </section>

  <section class="screen" id="settings" aria-label="설정">
    <div class="page">
      <h2 class="ink" data-text="설정"></h2>
      <div class="scroll" id="settingsBody"></div>
      <button class="back ink" data-go="main">돌아가기</button>
    </div>
  </section>
  </div>
</div>

<div class="lens" id="grain"></div>
<div class="lens" id="vignette"></div>
<div class="mark" id="mark"></div>
<div class="lens" id="blackout"></div>

<script>
"use strict";
/* ════════════════════════════════════════════════
   데이터
   ════════════════════════════════════════════════ */
const NOTICES = [
  { name: "Patch v-1.0.0", date: "2026-11-26", items: [
    "앱 첫 공개.",
    "메인 화면에 시작 · 세계관 · 설정 메뉴를 추가했습니다.",
    "메인 화면 배경에 혜성이 떨어지는 하늘과, 손에 든 캠코더처럼 움직이는 화면 연출을 넣었습니다.",
    "세계관: 스토리에서 만난 설정만 기록됩니다.",
    "설정: 글자 속도, 화면 흔들림, 타임라인 관리, 공지를 볼 수 있습니다.",
    "행성마다 '타임라인' 세이브 기능을 추가했습니다."
  ]}
];

/* 행성. rule: 'loop' = 시간여행 시 같은 타임라인에서 루프, 'branch' = 새 타임라인으로 분기 */
const PLANETS = [
  { id: 1, alias: "제 1 행성", name: "차원의 틈 : 120 - 494 - 159 - ACU - 추락하는 불빛", rule: "loop", lore: "planet-1" },
  { id: 2, alias: null, name: null, rule: "branch", lore: "planet-2" },
  { id: 3, alias: null, name: null, rule: "branch", lore: "planet-3" },
  { id: 4, alias: null, name: null, rule: "branch", lore: "planet-4" },
  { id: 5, alias: null, name: null, rule: "branch", lore: "planet-5" },
  { id: 6, alias: null, name: null, rule: "branch", lore: "planet-6" },
  { id: 7, alias: null, name: null, rule: "branch", lore: "planet-7" }
];

/* 세계관 항목: 스토리에서 unlock 되어야만 보인다 */
const LORE = {
  "planet-1": {
    title: "차원의 틈 : 120 - 494 - 159 - ACU - 추락하는 불빛", alias: "제 1 행성",
    body: [
      "추락하는 불빛 인원들이 살고있는 행성이다.",
      "이 행성의 특징은 “타임라인” 에 영향을 받지 않는 다는 것이다."
    ]
  },
  "timeline": {
    title: "타임라인", alias: "Timeline",
    body: [
      "제 1 타임라인, 우리가 살고있는 현실을 말한다.",
      "이 타임라인에서 제 2 타임라인으로 시간여행을 할 경우, 전부 되돌아가고, 운명법칙에 따라 그곳은 완전히 다른 세계가 되어버린다.",
      "하지만, 제 1 행성은 다르다. 시간여행을 할 지라도 제 2 타임라인으로 가지지 않고 일정한 시간선에서 계속 타임 루프를 하게된다."
    ]
  }
};

/* ════════════════════════════════════════════════
   저장소 (실패해도 앱은 돌아간다)
   ════════════════════════════════════════════════ */
const Store = {
  get(k, d) { try { const v = localStorage.getItem("fall-lux:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("fall-lux:" + k, JSON.stringify(v)); } catch (e) {} }
};
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const Settings = Object.assign({ textSpeed: "normal", shake: reduced ? "small" : "large" }, Store.get("settings", {}));
const saveSettings = () => Store.set("settings", Settings);

/* ════════════════════════════════════════════════
   타임라인 = 행성별 세이브 파일
   스토리 엔진은 FallLux.timeline 으로 저장/불러오기/시간여행을 한다.
   ════════════════════════════════════════════════ */
const Timeline = {
  _all() { return Store.get("timelines", {}); },
  _put(all) { Store.set("timelines", all); },
  list(planetId) { return (this._all()[planetId] || []).slice(); },
  create(planetId, state = {}) {
    const all = this._all(), arr = all[planetId] || (all[planetId] = []);
    const index = arr.reduce((m, t) => Math.max(m, t.index), 0) + 1;
    const tl = { id: planetId + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), planet: planetId, index,
      node: state.node || null, choices: state.choices || [], flags: state.flags || {}, loop: 0,
      createdAt: Date.now(), updatedAt: Date.now() };
    arr.push(tl); this._put(all); return tl;
  },
  load(planetId, id) { return this.list(planetId).find(t => t.id === id) || null; },
  save(planetId, id, patch) {
    const all = this._all(), arr = all[planetId] || [], t = arr.find(x => x.id === id);
    if (!t) return null;
    Object.assign(t, patch, { updatedAt: Date.now() }); this._put(all); return t;
  },
  remove(planetId, id) {
    const all = this._all(); all[planetId] = (all[planetId] || []).filter(t => t.id !== id); this._put(all);
  },
  /* 시간여행: 제 1 행성은 같은 타임라인 안에서 루프, 그 외에는 새 타임라인(완전히 다른 세계)으로 분기 */
  timeTravel(planetId, id, toNode) {
    const p = PLANETS.find(x => x.id === planetId), cur = this.load(planetId, id);
    if (!p || !cur) return null;
    if (p.rule === "loop") return this.save(planetId, id, { node: toNode, loop: cur.loop + 1 });
    return this.create(planetId, { node: toNode });
  }
};
const Lore = {
  unlocked() { return Store.get("lore", []); },
  unlock(key) { const u = this.unlocked(); if (LORE[key] && !u.includes(key)) { u.push(key); Store.set("lore", u); } }
};
window.FallLux = { timeline: Timeline, lore: Lore, planets: PLANETS };

/* ════════════════════════════════════════════════
   글자 애니메이션
   ════════════════════════════════════════════════ */
const STEP = { slow: 120, normal: 70, fast: 34 };
function typeset(el, text, base = 0) {
  el.textContent = "";
  el.style.setProperty("--step", STEP[Settings.textSpeed] + "ms");
  el.style.setProperty("--base", base + "ms");
  [...text].forEach((c, i) => {
    const s = document.createElement("span");
    s.className = "ch" + (c === " " ? " sp" : "");
    s.textContent = c === " " ? " " : c;
    s.style.setProperty("--i", i);
    s.setAttribute("aria-hidden", "true");
    el.appendChild(s);
  });
  el.setAttribute("aria-label", text);
}
function typesetAll(root, base = 0) {
  let t = base;
  root.querySelectorAll("[data-text]").forEach(el => {
    const n = [...el.dataset.text].length;
    typeset(el, el.dataset.text, t);
    t += Math.min(n * STEP[Settings.textSpeed] * 0.5, 900) + 80;
  });
}
function para(tag, text, cls) {
  const el = document.createElement(tag); if (cls) el.className = cls; el.dataset.text = text; return el;
}

/* ════════════════════════════════════════════════
   화면 전환
   ════════════════════════════════════════════════ */
let current = null;
function go(name, push = true) {
  if (name === current) return;
  document.body.classList.toggle("home", name === "main");
  if (name === "start") {
    document.body.classList.add("blank");
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("on"));
    current = "start";
    if (push) history.pushState({ s: "start" }, "");
    setTimeout(() => { if (current === "start") Sky.pause(); }, 1700);
    return;
  }
  document.body.classList.remove("blank");
  Sky.resume();
  if (name === "lore") renderLore();
  if (name === "settings") renderSettings();
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === name));
  typesetAll(document.getElementById(name), 250);
  current = name;
  if (push && name !== "main") history.pushState({ s: name }, "");
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-go]");
  if (!b) return;
  if (b.dataset.go === "main" && history.state && history.state.s) { history.back(); return; }
  go(b.dataset.go);
});
addEventListener("popstate", e => go((e.state && e.state.s) || "main", false));
addEventListener("keydown", e => { if (e.key === "Escape" && current !== "main") history.back(); });

/* ── 세계관 ── */
function renderLore() {
  const box = document.getElementById("loreList"); box.innerHTML = "";
  const keys = Lore.unlocked().filter(k => LORE[k]);
  if (!keys.length) { box.appendChild(para("p", "아직 기록된 설정이 없다.", "empty")); return; }
  keys.forEach(k => {
    const d = LORE[k], art = document.createElement("article"); art.className = "entry";
    art.appendChild(para("h3", d.title));
    if (d.alias) art.appendChild(para("div", d.alias, "alias"));
    d.body.forEach(t => art.appendChild(para("p", t)));
    box.appendChild(art);
  });
}

/* ── 설정 ── */
function optionRow(label, key, opts) {
  const row = document.createElement("div"); row.className = "row";
  row.appendChild(para("span", label, "label"));
  opts.forEach(([v, t]) => {
    const b = document.createElement("button"); b.className = "opt"; b.textContent = t;
    b.setAttribute("aria-pressed", String(Settings[key] === v));
    b.onclick = () => {
      Settings[key] = v; saveSettings();
      row.querySelectorAll(".opt").forEach(o => o.setAttribute("aria-pressed", String(o === b)));
      if (key === "shake") Cam.setMode(v);
    };
    row.appendChild(b);
  });
  return row;
}
function renderSettings() {
  const box = document.getElementById("settingsBody"); box.innerHTML = "";
  const g1 = document.createElement("div"); g1.className = "group";
  g1.appendChild(para("h4", "Reading"));
  g1.appendChild(optionRow("글자 속도", "textSpeed", [["slow", "느리게"], ["normal", "보통"], ["fast", "빠르게"]]));
  g1.appendChild(optionRow("화면 흔들림", "shake", [["large", "크게"], ["small", "작게"], ["off", "끄기"]]));
  box.appendChild(g1);

  const g2 = document.createElement("div"); g2.className = "group";
  g2.appendChild(para("h4", "Timeline"));
  const known = Lore.unlocked();
  PLANETS.forEach(p => {
    const wrap = document.createElement("div"); wrap.className = "planet";
    const nm = document.createElement("div"); nm.className = "pname";
    const num = document.createElement("span"); num.className = "pnum"; num.textContent = String(p.id).padStart(2, "0");
    nm.appendChild(num);
    nm.appendChild(document.createTextNode(known.includes(p.lore) && p.alias ? p.alias : "???"));
    wrap.appendChild(nm);
    const tls = Timeline.list(p.id);
    if (!tls.length) {
      const t = document.createElement("div"); t.className = "tl"; t.textContent = "기록된 타임라인 없음"; wrap.appendChild(t);
    }
    tls.forEach(tl => {
      const t = document.createElement("div"); t.className = "tl";
      const d = new Date(tl.updatedAt);
      t.textContent = "제 " + tl.index + " 타임라인" + (p.rule === "loop" && tl.loop ? " · 루프 " + tl.loop : "") +
        " · " + d.getFullYear() + "." + (d.getMonth() + 1) + "." + d.getDate();
      const del = document.createElement("button"); del.textContent = "지우기";
      del.onclick = () => { if (confirm("이 타임라인을 지울까요? 되돌릴 수 없습니다.")) { Timeline.remove(p.id, tl.id); renderSettings(); } };
      t.appendChild(del); wrap.appendChild(t);
    });
    g2.appendChild(wrap);
  });
  box.appendChild(g2);

  const g3 = document.createElement("div"); g3.className = "group";
  g3.appendChild(para("h4", "Notice"));
  NOTICES.forEach(n => {
    const a = document.createElement("article"); a.className = "notice";
    a.appendChild(para("h5", n.name));
    const tm = document.createElement("time"); tm.textContent = n.date; a.appendChild(tm);
    const ul = document.createElement("ul"); n.items.forEach(i => ul.appendChild(para("li", i))); a.appendChild(ul);
    g3.appendChild(a);
  });
  box.appendChild(g3);
}

/* ════════════════════════════════════════════════
   하늘: 블러된 노란 그라데이션 우주 + 떨어지는 혜성
   ════════════════════════════════════════════════ */
const Sky = (() => {
  const sky = document.createElement("canvas"), fx = document.getElementById("fx");
  const sctx = sky.getContext("2d"), ctx = fx.getContext("2d");
  let W = 0, H = 0, dpr = 1, quality = 1, stars = [], comets = [], nextSpawn = 0, running = true, raf = 0, last = 0;
  const rnd = (a, b) => a + Math.random() * (b - a);

  function paintSky() {
    /* 낮은 해상도로 그린 뒤 늘려서, 그 자체로 초점이 나간 하늘이 되게 한다 */
    const s = 0.25, w = Math.max(64, Math.round(W * s)), h = Math.max(64, Math.round(H * s));
    sky.width = w; sky.height = h;
    const g = sctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0.00, "#0b0710");
    g.addColorStop(0.28, "#1d1209");
    g.addColorStop(0.55, "#5a3512");
    g.addColorStop(0.76, "#b9761f");
    g.addColorStop(0.90, "#e8ae45");
    g.addColorStop(1.00, "#f7d98c");
    sctx.fillStyle = g; sctx.fillRect(0, 0, w, h);
    /* 성운: 넓고 부드러운 빛 덩어리 몇 개만 (작은 점이 뭉치지 않게) */
    const blobs = [[0.78, 0.30, 0.55, "rgba(233,176,76,.20)"], [0.18, 0.55, 0.65, "rgba(201,120,40,.22)"],
                   [0.55, 0.85, 0.80, "rgba(255,214,140,.30)"], [0.35, 0.12, 0.45, "rgba(120,70,40,.18)"]];
    blobs.forEach(([x, y, r, c]) => {
      const rg = sctx.createRadialGradient(x * w, y * h, 0, x * w, y * h, r * Math.max(w, h));
      rg.addColorStop(0, c); rg.addColorStop(1, "rgba(0,0,0,0)");
      sctx.fillStyle = rg; sctx.fillRect(0, 0, w, h);
    });
    /* 아주 옅은 구름 띠 */
    sctx.globalAlpha = 0.10;
    for (let i = 0; i < 5; i++) {
      sctx.fillStyle = i % 2 ? "#f3cf86" : "#2a1708";
      sctx.beginPath(); sctx.ellipse(rnd(0, w), h * rnd(0.55, 0.9), w * rnd(0.3, 0.6), h * rnd(0.03, 0.07), rnd(-0.1, 0.1), 0, Math.PI * 2); sctx.fill();
    }
    sctx.globalAlpha = 1;
    /* 한 번 더 흐리게 (작은 캔버스라 한 번만 계산하면 된다) */
    const tmp = document.createElement("canvas"); tmp.width = w; tmp.height = h;
    const tc = tmp.getContext("2d"); tc.filter = "blur(1.5px)"; tc.drawImage(sky, 0, 0);
    sctx.clearRect(0, 0, w, h); sctx.drawImage(tmp, 0, 0);
  }

  function makeStars() {
    /* 균일하게 흩어진 별. 덩어리지지 않도록 격자 칸마다 최대 하나 */
    stars = [];
    const cell = 90, cols = Math.ceil(W / cell), rows = Math.ceil(H * 0.7 / cell);
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      if (Math.random() < 0.45) continue;
      stars.push({ x: (x + Math.random()) * cell, y: (y + Math.random()) * cell, r: rnd(0.5, 1.6),
        a: rnd(0.25, 0.8), tw: rnd(0.15, 0.6), ph: rnd(0, 6.28) });
    }
  }

  let lastW = 0, lastH = 0;
  function resize(force) {
    W = innerWidth; H = innerHeight;
    dpr = Math.min(devicePixelRatio || 1, 1.5) * quality;
    fx.width = Math.round(W * dpr); fx.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (force || W !== lastW || H !== lastH) { paintSky(); makeStars(); lastW = W; lastH = H; }
  }

  function spawn(big) {
    /* 위쪽 가장자리나 오른쪽 위에서 시작해 왼쪽 아래로 떨어진다 */
    const ang = rnd(1.95, 2.35);
    const speed = big ? rnd(70, 120) : rnd(160, 420);
    const fromTop = Math.random() < 0.7;
    comets.push({
      x: fromTop ? rnd(W * 0.15, W * 1.15) : W + 40, y: fromTop ? -40 : rnd(-40, H * 0.45),
      vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed,
      len: big ? rnd(380, 620) : rnd(110, 320), r: big ? rnd(2.6, 3.6) : rnd(1.1, 2.2),
      life: 0, max: big ? rnd(9, 14) : rnd(2.6, 6), hue: rnd(38, 52), big
    });
  }

  function tail(c, ux, uy, len, w, a0, a1) {
    const tx = c.x - ux * len, ty = c.y - uy * len, nx = -uy, ny = ux;
    const g = ctx.createLinearGradient(c.x, c.y, tx, ty);
    g.addColorStop(0, `hsla(${c.hue},100%,86%,${a0})`);
    g.addColorStop(0.18, `hsla(${c.hue},95%,68%,${a1})`);
    g.addColorStop(1, `hsla(${c.hue - 8},90%,55%,0)`);
    ctx.fillStyle = g;
    /* 머리 쪽은 둥글게, 꼬리 끝으로 갈수록 가늘어진다 */
    ctx.beginPath();
    ctx.moveTo(c.x + nx * w, c.y + ny * w);
    ctx.quadraticCurveTo(c.x + ux * w * 1.4, c.y + uy * w * 1.4, c.x - nx * w, c.y - ny * w);
    ctx.lineTo(tx, ty);
    ctx.closePath(); ctx.fill();
  }
  function drawComet(c) {
    const sp = Math.hypot(c.vx, c.vy), ux = c.vx / sp, uy = c.vy / sp;
    const fade = Math.min(1, c.life / 0.6, (c.max - c.life) / 1.2);
    if (fade <= 0) return;
    tail(c, ux, uy, c.len * 0.85, c.r * 2.6, 0.22 * fade, 0.10 * fade);   // 넓고 흐린 빛 번짐
    tail(c, ux, uy, c.len, c.r * 0.9, 0.95 * fade, 0.5 * fade);          // 가는 심지
    const hr = c.r * (c.big ? 8 : 5.5);
    const rg = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, hr);
    rg.addColorStop(0, `rgba(255,250,232,${fade})`);
    rg.addColorStop(0.2, `hsla(${c.hue},100%,78%,${0.5 * fade})`);
    rg.addColorStop(1, "rgba(255,200,100,0)");
    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(c.x, c.y, hr, 0, Math.PI * 2); ctx.fill();
  }

  /* 프레임 감시: 40fps 아래로 내려가면 품질을 낮춰 30fps 밑으로 떨어지지 않게 하고, 여유가 있으면 다시 올린다 */
  let acc = 0, frames = 0;
  function watch(dt) {
    acc += dt; frames++;
    if (acc < 2) return;
    const fps = frames / acc; acc = 0; frames = 0;
    if (fps < 40 && quality > 0.5) { quality = Math.max(0.5, quality - 0.15); resize(); }
    else if (fps > 56 && quality < 1) { quality = Math.min(1, quality + 0.1); resize(); }
  }

  function frame(t) {
    raf = requestAnimationFrame(frame);
    const dt = Math.min(0.05, (t - last) / 1000 || 0.016); last = t;
    watch(dt);
    const now = t / 1000;
    const c0 = Cam.tick(dt);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.translate(W / 2 + c0.x, H / 2 + c0.y); ctx.rotate(c0.r * Math.PI / 180); ctx.scale(c0.z, c0.z); ctx.translate(-W / 2, -H / 2);
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(sky, -2, -2, W + 4, H + 4);
    ctx.globalCompositeOperation = "lighter";
    for (const s of stars) {
      const a = s.a * (0.65 + 0.35 * Math.sin(now * s.tw * 6.28 + s.ph));
      ctx.fillStyle = `rgba(255,240,205,${a})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
    if (now > nextSpawn) {
      const maxC = Math.round(7 * quality) + 2;
      if (comets.length < maxC) spawn(Math.random() < 0.12);
      nextSpawn = now + rnd(0.5, 1.9);
    }
    for (let i = comets.length - 1; i >= 0; i--) {
      const c = comets[i];
      c.life += dt; c.x += c.vx * dt; c.y += c.vy * dt;
      if (c.life > c.max || c.y - c.len > H + 60 || c.x + c.len < -60) { comets.splice(i, 1); continue; }
      drawComet(c);
    }
    ctx.globalCompositeOperation = "source-over";
  }

  addEventListener("resize", () => resize());
  resize(true);
  spawn(true);
  raf = requestAnimationFrame(t => { last = t; frame(t); });
  return {
    pause() { running = false; cancelAnimationFrame(raf); },
    resume() { if (!running) { running = true; last = performance.now(); raf = requestAnimationFrame(frame); } },
    fps() { return quality; }
  };
})();

/* ════════════════════════════════════════════════
   캠코더: 사람이 손에 들고 찍는 화면
   느리고 큰 흔들림 ↔ 작은 흔들림이 무작위로 오간다
   ════════════════════════════════════════════════ */
const Cam = (() => {
  const el = document.getElementById("stage"), pose = { x: 0, y: 0, r: 0, z: 1 };
  function noise1(seed) {
    const vals = Array.from({ length: 256 }, () => Math.random() * 2 - 1);
    return x => {
      const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
      const a = vals[(i + seed) & 255], b = vals[(i + seed + 1) & 255];
      return a + (b - a) * u;
    };
  }
  const nx = noise1(11), ny = noise1(97), nr = noise1(173), nz = noise1(41), jx = noise1(5), jy = noise1(201);
  const MODES = { large: 1, small: 0.35, off: 0 };
  let modeMul = MODES[Settings.shake] ?? 1, env = 0.5, envTarget = 0.8, envTimer = 0, t = Math.random() * 100;

  function tick(dt) {
    t += dt;
    envTimer -= dt;
    if (envTimer <= 0) {
      /* 다음 몇 초 동안의 흔들림 세기: 크게 / 보통 / 거의 멈춤 */
      const r = Math.random();
      envTarget = r < 0.4 ? 1 : r < 0.75 ? 0.45 : 0.12;
      envTimer = 3 + Math.random() * 6;
    }
    env += (envTarget - env) * Math.min(1, dt * 0.45);
    if (!modeMul) { pose.x = pose.y = pose.r = 0; pose.z = 1; return pose; }
    const k = env * modeMul;
    const m = Math.min(innerWidth, innerHeight);
    const sx = 0.22;
    const x = (nx(t * sx) * 0.75 + nx(t * sx * 2.3 + 40) * 0.25) * m * 0.032 * k + jx(t * 1.7) * 1.4 * k;
    const y = (ny(t * sx * 0.9) * 0.75 + ny(t * sx * 2.1 + 80) * 0.25) * m * 0.026 * k + jy(t * 1.9) * 1.2 * k;
    const r = nr(t * sx * 0.8) * 1.3 * k;
    const z = 1.1 + nz(t * 0.07) * 0.018 * Math.max(k, 0.3);
    pose.x = x; pose.y = y; pose.r = r; pose.z = z;
    /* 글자는 하늘보다 살짝 덜 확대해 화면 밖으로 밀려나지 않게 한다 */
    el.style.transform = `translate3d(${x.toFixed(2)}px,${y.toFixed(2)}px,0) rotate(${r.toFixed(3)}deg)`;
    return pose;
  }
  return { tick, setMode(m) { modeMul = MODES[m] ?? 1; if (!modeMul) el.style.transform = "none"; } };
})();

/* ════════════════════════════════════════════════
   필름 그레인 (렌즈 노이즈)
   ════════════════════════════════════════════════ */
(() => {
  const c = document.createElement("canvas"); c.width = c.height = 160;
  const x = c.getContext("2d"), d = x.createImageData(160, 160);
  for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  x.putImageData(d, 0, 0);
  document.getElementById("grain").style.backgroundImage = `url(${c.toDataURL()})`;
})();

/* ════════════════════════════════════════════════
   시작
   ════════════════════════════════════════════════ */
document.getElementById("mark").textContent = NOTICES[0].name;
history.replaceState({ s: null }, "");
/* 글꼴이 준비된 뒤에 글자를 찍는다 (최대 2초 대기) */
Promise.race([
  document.fonts ? Promise.all([document.fonts.load('40px "Song Myung"', "시작세계관설정"), document.fonts.load('16px "IM Fell English"', "Patch")]) : Promise.resolve(),
  new Promise(r => setTimeout(r, 2000))
]).catch(() => {}).then(() => go("main", false));
/* 안드로이드 뒤로가기 (Capacitor) */
try {
  const App = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
  if (App) App.addListener("backButton", () => { if (current !== "main") history.back(); else App.exitApp(); });
} catch (e) {}
</script>
