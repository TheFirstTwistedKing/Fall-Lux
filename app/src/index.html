<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<title>Fall-Lux</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230e0803'/%3E%3Cpath d='M26 4 9 23' stroke='%23e9b04c' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='9' cy='23' r='3' fill='%23fff3d6'/%3E%3C/svg%3E">
<style>
/* ════════════════════════════════════════════════════════════════
   방향: 하늘색 · 노란 불빛이 떨어지는 밤하늘을 손에 든 캠코더로 찍은, 1970년대 활판 타이틀 카드
   색은 '추락하는 불빛 위키'를 따른다: 짙은 우주 #14161a, 하늘색 불빛 #4cc9ff, 노란 불빛 #ffd84a
   글꼴 2개: 송명(한글 전부) / IM Fell English(라틴 소제목·숫자)
   ════════════════════════════════════════════════════════════════ */
@font-face{font-family:"Song Myung";src:url("fonts/SongMyung.woff2") format("woff2");font-display:block}
@font-face{font-family:"IM Fell English";src:url("fonts/IMFellEnglish.woff2") format("woff2");font-display:block}

:root{
  /* 색 (모두 대비 계산 후 확정: 그늘 위 4.5:1 이상) */
  --c-ink:#fff3c0;          /* 본문·제목: 위키 제목과 같은 연노랑 잉크 */
  --c-ink-2:#cfc8ac;        /* 보조 글자 */
  --c-blue:#4cc9ff;         /* 하늘색 불빛: 소제목 */
  --c-ember:#ffd84a;        /* 노란 불빛: 선택 표시 */
  --c-space:#14161a;        /* 짙은 우주 */
  --c-shade:#0c0e13;        /* 그늘 */
  --c-night:#000;

  /* 글자 크기: 16px 기준 1.25배 체계 */
  --fs-xs:.875rem;  --fs-sm:1rem;  --fs-md:1.125rem;  --fs-lg:1.375rem;
  --fs-xl:1.75rem;  --fs-2xl:2.75rem;  --fs-display:clamp(4rem,12vw,8rem);

  /* 간격: 8px 단위 */
  --s1:8px; --s2:16px; --s3:24px; --s4:32px; --s6:48px; --s8:64px; --s12:96px;
  --tap:48px;               /* 안드로이드 48dp 터치 영역 */

  /* 움직임: 용도별 시간 (나갈 때가 들어올 때보다 빠르다) */
  --d-tap:120ms; --d-hover:240ms; --d-enter:760ms; --d-exit:420ms;
  --ease-out:cubic-bezier(.2,.7,.2,1); --ease-in:cubic-bezier(.5,0,.75,0);

  --serif:"Song Myung","IM Fell English",serif;
  --latin:"IM Fell English","Song Myung",serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-r:env(safe-area-inset-right,0px);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-l:env(safe-area-inset-left,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--c-space);overflow:hidden;overscroll-behavior:none}
body{color:var(--c-ink);font-family:var(--serif);font-size:var(--fs-md);-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left;
  transition:color var(--d-hover) ease,transform var(--d-hover) var(--ease-out),opacity var(--d-tap) ease}
button:active{opacity:.55;transition-duration:var(--d-tap)}
:focus{outline:none}
:focus-visible{outline:1px solid var(--c-ember);outline-offset:6px}
[tabindex="-1"]:focus,[tabindex="-1"]:focus-visible{outline:none}

/* ── 장면 ── */
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
/* 글자 층: 하늘과 같은 값으로 흔들린다 */
#stage{position:fixed;inset:0;transform-origin:50% 50%;will-change:transform}
.lens{position:fixed;inset:0;pointer-events:none}
#grain{opacity:.05;background-size:160px 160px;animation:grain 1s steps(6) infinite}
@keyframes grain{0%{background-position:0 0}17%{background-position:-37px 21px}33%{background-position:52px -44px}
  50%{background-position:-18px 63px}67%{background-position:71px 9px}83%{background-position:-60px -30px}100%{background-position:0 0}}
body.lowfx #grain{display:none}
#vignette{background:radial-gradient(125% 100% at 50% 46%,transparent 58%,rgba(6,7,10,.45) 84%,rgba(3,4,6,.85) 100%)}
#blackout{background:var(--c-night);opacity:0;transition:opacity 1.4s ease}
body.blank #blackout{opacity:1;pointer-events:auto}

/* ── 화면 전환: 초점이 맞아 들어오고, 더 빠르게 흐려지며 나간다 ── */
.screen{position:absolute;inset:0;
  padding:calc(var(--s6) + var(--safe-t)) calc(var(--s3) + var(--safe-r)) calc(var(--s4) + var(--safe-b)) calc(var(--s3) + var(--safe-l));
  opacity:0;visibility:hidden;filter:blur(8px);transform:scale(1.02);
  transition:opacity var(--d-exit) var(--ease-in),filter var(--d-exit) var(--ease-in),transform var(--d-exit) var(--ease-in),visibility 0s linear var(--d-exit)}
.screen.on{opacity:1;visibility:visible;filter:none;transform:none;
  transition:opacity var(--d-enter) var(--ease-out) 120ms,filter var(--d-enter) var(--ease-out) 120ms,transform var(--d-enter) var(--ease-out) 120ms,visibility 0s}

/* 활판 잉크: 가장자리가 살짝 번진 글자 */
.ink{filter:url(#ink);text-shadow:0 0 1px rgba(255,243,192,.5),0 0 18px rgba(255,216,74,.28),0 1px 0 rgba(0,0,0,.4)}

/* ── 메인: 왼쪽 아래 세로 목록. 가장 큰 것은 '시작' 하나 ── */
#main{display:flex;flex-direction:column;justify-content:flex-end}
#main::before{content:"";position:absolute;inset:-10%;pointer-events:none;
  background:radial-gradient(70% 62% at 12% 80%,rgba(12,14,19,.62) 0%,rgba(12,14,19,.45) 38%,rgba(12,14,19,0) 78%)}
.menu{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:var(--s1);
  padding-left:clamp(0px,6vw,var(--s12));padding-bottom:clamp(var(--s2),8vh,var(--s12))}
.menu button{display:flex;align-items:center;min-height:var(--tap);line-height:1;letter-spacing:.16em}
.menu .primary{font-size:var(--fs-display);letter-spacing:.2em;margin-bottom:var(--s1)}
.menu .sub{font-size:var(--fs-xl)}
.menu button:hover{transform:translateX(var(--s1));color:#fff}

.mark{position:fixed;right:calc(var(--s3) + var(--safe-r));top:calc(var(--s3) + var(--safe-t));
  font-family:var(--latin);font-size:var(--fs-xs);letter-spacing:.14em;color:var(--c-ink);transition:opacity var(--d-exit)}
body:not(.home) .mark{opacity:0}

/* 글자 하나씩 잉크가 번지며 찍힌다 */
.ch{display:inline-block;opacity:0;filter:blur(5px);transform:translateY(.1em);
  animation:inkin .8s var(--ease-out) forwards;animation-delay:calc(var(--i) * var(--step,60ms) + var(--base,0ms))}
.ch.sp{width:.3em}
@keyframes inkin{55%{opacity:.85;filter:blur(1px)}100%{opacity:1;filter:none;transform:none}}

/* ── 세계관 / 설정: 테두리 없는 글자만의 화면 ── */
#lore::before,#settings::before{content:"";position:absolute;inset:-10%;pointer-events:none;
  background:linear-gradient(90deg,rgba(12,14,19,.78) 0%,rgba(12,14,19,.6) 50%,rgba(12,14,19,.2) 85%)}
.page{position:relative;max-width:46rem;margin-left:clamp(0px,6vw,var(--s12));height:100%;display:flex;flex-direction:column}
.page h2{font-weight:400;font-size:var(--fs-2xl);letter-spacing:.16em;line-height:1.1;margin-bottom:var(--s4)}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 var(--s1) var(--s4) 0;
  mask-image:linear-gradient(#000 calc(100% - var(--s6)),transparent);-webkit-mask-image:linear-gradient(#000 calc(100% - var(--s6)),transparent);
  scrollbar-width:none;user-select:text;-webkit-user-select:text}
.scroll::-webkit-scrollbar{display:none}
.back{margin-top:var(--s2);min-height:var(--tap);font-size:var(--fs-lg);letter-spacing:.2em;color:var(--c-ink-2);align-self:flex-start}
.back:hover{color:var(--c-ink);transform:translateX(calc(var(--s1) * -1))}
.empty{font-size:var(--fs-lg);line-height:1.8;color:var(--c-ink-2);letter-spacing:.06em}

.entry{margin-bottom:var(--s6);max-width:36rem}
.entry h3{font-weight:400;font-size:var(--fs-xl);line-height:1.3;letter-spacing:.06em;margin-bottom:var(--s1);word-break:keep-all}
.entry .alias{font-size:var(--fs-sm);color:var(--c-blue);letter-spacing:.12em;margin-bottom:var(--s2)}
.entry p{font-size:var(--fs-md);line-height:1.9;margin-bottom:var(--s1);word-break:keep-all}

.group{margin-bottom:var(--s6)}
.group h4{font-family:var(--latin);font-weight:400;font-size:var(--fs-xs);letter-spacing:.28em;color:var(--c-blue);margin-bottom:var(--s2);text-transform:uppercase}
.row{display:flex;flex-wrap:wrap;align-items:center;column-gap:var(--s3);margin-bottom:var(--s1)}
.row .label{font-size:var(--fs-lg);min-width:8em;letter-spacing:.06em}
.opt{min-height:var(--tap);font-size:var(--fs-md);letter-spacing:.1em;color:var(--c-ink-2)}
.opt:hover{color:var(--c-ink)}
.opt[aria-pressed="true"]{color:var(--c-ink)}
.opt::before{content:"—";display:inline-block;width:1.4em;color:var(--c-ember);opacity:0;transform:translateX(-4px);
  transition:opacity var(--d-hover),transform var(--d-hover) var(--ease-out)}
.opt[aria-pressed="true"]::before{opacity:1;transform:none}
.planet{margin-bottom:var(--s2)}
.planet .pname{font-size:var(--fs-lg);letter-spacing:.06em;line-height:var(--tap)}
.planet .pnum{font-family:var(--latin);color:var(--c-blue);margin-right:var(--s2);font-size:var(--fs-sm)}
.tl{display:flex;flex-wrap:wrap;align-items:center;column-gap:var(--s2);font-size:var(--fs-sm);color:var(--c-ink-2);
  padding-left:var(--s6);min-height:var(--s4)}
.tl button{min-height:var(--tap);color:var(--c-ink-2);letter-spacing:.1em}
.tl button:hover{color:var(--c-ink)}
.notice{margin-bottom:var(--s4);max-width:36rem}
.notice h5{font-family:var(--latin);font-weight:400;font-size:var(--fs-lg);letter-spacing:.08em}
.notice time{display:block;font-family:var(--latin);font-size:var(--fs-xs);color:var(--c-ink-2);margin:var(--s1) 0}
.notice li{list-style:none;font-size:var(--fs-sm);line-height:1.8;word-break:keep-all;padding-left:1.1em;text-indent:-1.1em}
.notice li::before{content:"·  ";color:var(--c-ember);font-family:var(--latin)}

@media (max-width:560px){
  .menu{padding-left:var(--s1)}
  .page{margin-left:0}
  .row .label{min-width:100%;margin-top:var(--s1)}
  .tl{padding-left:var(--s4)}
  #lore::before,#settings::before{background:rgba(12,14,19,.72)}
}
@media (max-height:480px){
  .menu .primary{font-size:3.25rem}.menu .sub{font-size:var(--fs-lg)}
  .menu{padding-bottom:var(--s1)}
  .screen{padding-top:calc(var(--s3) + var(--safe-t));padding-bottom:calc(var(--s2) + var(--safe-b))}
  .page h2{font-size:var(--fs-xl);margin-bottom:var(--s2)}
}
/* 움직임 줄이기: 글자는 바로 보이고, 화면 전환은 짧은 페이드만 */
@media (prefers-reduced-motion:reduce){
  .ch{animation:none;opacity:1;filter:none;transform:none}
  .screen,.screen.on{filter:none;transform:none}
  #grain{animation:none}
  .menu button:hover{transform:none}
}

/* ════════ 행성 지도 · 행성 안 ════════ */
.layer{position:fixed;inset:0;background:var(--c-space)}
.layer[hidden]{display:none}
.map-gl,.story-root{position:absolute;inset:0;overflow:hidden}
/* 위아래 가장자리 그늘: 지도 위 글자 버튼이 늘 읽히게 */
#map::after,#planet::after{content:"";position:absolute;left:0;right:0;top:0;height:calc(var(--s12) + var(--safe-t));pointer-events:none;z-index:1;
  background:linear-gradient(rgba(12,14,19,.78),rgba(12,14,19,0))}
#map::before{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(var(--s12) + var(--safe-b));pointer-events:none;z-index:1;
  background:linear-gradient(0deg,rgba(12,14,19,.7),rgba(12,14,19,0))}
.map-hint{z-index:2}
.map-gl canvas,.story-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.lock-layer{position:absolute;inset:0;pointer-events:none}
.lock{position:absolute;left:0;top:0;color:#d8c77a;filter:drop-shadow(0 0 6px rgba(255,216,74,.45));transition:opacity .3s}
.layer .back{position:absolute;left:calc(var(--s3) + var(--safe-l));top:calc(var(--s2) + var(--safe-t));margin:0;color:var(--c-ink);z-index:3}
.map-hint{position:absolute;left:calc(var(--s3) + var(--safe-l));bottom:calc(var(--s3) + var(--safe-b));font-size:var(--fs-sm);letter-spacing:.12em;color:var(--c-ink-2);transition:opacity var(--d-exit)}
.map-hint.off{opacity:0}
.map-step{position:absolute;right:calc(var(--s3) + var(--safe-r));bottom:calc(var(--s2) + var(--safe-b));display:flex;gap:var(--s2);z-index:3}
.map-step button{min-height:var(--tap);font-size:var(--fs-sm);letter-spacing:.12em;color:var(--c-ink-2)}
.map-step button:hover{color:var(--c-ink)}
/* 정보 글: 테두리 없이, 뒤에 어두운 그늘만 */
.panel{position:absolute;left:0;bottom:0;width:min(30rem,100%);max-height:100%;overflow-y:auto;z-index:2;
  padding:var(--s12) calc(var(--s4) + var(--safe-r)) calc(var(--s8) + var(--safe-b)) calc(var(--s4) + var(--safe-l));
  background:radial-gradient(130% 100% at 0% 100%,rgba(12,14,19,.88) 30%,rgba(12,14,19,.6) 60%,rgba(12,14,19,0) 85%);
  user-select:text;-webkit-user-select:text;scrollbar-width:none}
.panel::-webkit-scrollbar{display:none}
.panel[hidden]{display:none}
.panel .kind{display:block;font-family:var(--serif);font-size:var(--fs-xs);letter-spacing:.28em;color:var(--c-blue);text-transform:uppercase}
.panel h2{font-weight:400;font-size:var(--fs-2xl);line-height:1.15;letter-spacing:.12em;margin:var(--s1) 0 var(--s1)}
.panel .full{font-size:var(--fs-sm);color:var(--c-ink-2);letter-spacing:.06em;margin-bottom:var(--s3);word-break:keep-all}
.panel dl{display:grid;gap:var(--s1) 0;margin-bottom:var(--s3)}
.panel dt{font-size:var(--fs-xs);letter-spacing:.2em;color:var(--c-blue);margin-top:var(--s2)}
.panel dd{font-size:var(--fs-md);line-height:1.8;word-break:keep-all}
.panel .acts{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s3);align-items:center}
.panel .acts button{min-height:var(--tap);font-size:var(--fs-lg);letter-spacing:.2em;color:var(--c-ink)}
.panel .acts .go{font-size:var(--fs-xl);letter-spacing:.3em}
.panel .acts .go::before{content:"— ";color:var(--c-ember)}
.panel .acts button[aria-disabled="true"]{color:var(--c-ink-2);cursor:default}
.panel .acts button[aria-disabled="true"]::before{content:none}
.panel .acts .quiet{font-size:var(--fs-sm);color:var(--c-ink-2)}
@media (max-width:640px){
  .panel{width:100%;max-height:58%;padding:var(--s6) calc(var(--s3) + var(--safe-r)) calc(var(--s8) + var(--safe-b)) calc(var(--s3) + var(--safe-l));
    background:linear-gradient(0deg,rgba(12,14,19,.92) 55%,rgba(12,14,19,.7) 80%,rgba(12,14,19,0))}
  .panel h2{font-size:var(--fs-xl)}
  .map-step{bottom:auto;top:calc(var(--s2) + var(--safe-t))}
}
/* 이야기 지도의 갈림목 */
.story-nodes{position:absolute;inset:0;pointer-events:none}
.node{position:absolute;left:0;top:0;width:64px;height:64px;display:grid;place-items:center;pointer-events:auto;border-radius:50%;
  background:radial-gradient(circle,rgba(16,13,38,.9) 38%,rgba(16,13,38,.5) 55%,rgba(16,13,38,0) 72%);color:#ffe9a8;text-align:center}
.node svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round;overflow:visible}
.node.star{color:#9fe3ff}
.node.open::after{content:"";position:absolute;inset:6px;border-radius:50%;box-shadow:0 0 0 1px currentColor,0 0 18px currentColor;opacity:.0;animation:nodePulse 2.4s var(--ease-out) infinite}
.node.done svg{fill:currentColor;fill-opacity:.28}
.node.done{color:var(--c-ember)}
.node.star.done{color:var(--c-blue)}
.node.locked{color:rgba(207,200,172,.42);cursor:default}
.node:not(.locked):hover{transform-origin:center}
@keyframes nodePulse{0%{opacity:.85;transform:scale(.85)}100%{opacity:0;transform:scale(1.5)}}
/* 행성 안으로 들어올 때: 짧게 찢어지듯 맞춰지는 화면 (밝게 번쩍이지 않는다) */
#planet.glitch-in{animation:glitchIn .12s steps(4,end) both}
/* 입장 순간: 지도 위의 글자도 3D 화면과 함께 찢어지고 색이 갈라진다 (밝기는 그대로) */
#map.glitching .panel,#map.glitching .back,#map.glitching .map-step{animation:uiGlitch .28s steps(7,end) both;text-shadow:2px 0 rgba(255,40,60,.75),-2px 0 rgba(40,200,255,.75)}
@keyframes uiGlitch{0%{clip-path:inset(0);transform:none}14%{clip-path:inset(12% 0 64% 0);transform:translateX(-10px)}28%{clip-path:inset(52% 0 14% 0);transform:translateX(9px)}
  42%{clip-path:inset(0 0 78% 0);transform:translateX(-14px)}57%{clip-path:inset(34% 0 30% 0);transform:translateX(6px)}71%{clip-path:inset(70% 0 4% 0);transform:translateX(-5px)}
  86%{clip-path:inset(20% 0 52% 0);transform:translateX(12px)}100%{clip-path:inset(46% 0 46% 0);transform:none;opacity:0}}
@keyframes glitchIn{0%{clip-path:inset(8% 0 58% 0);transform:translateX(-14px)}25%{clip-path:inset(46% 0 18% 0);transform:translateX(11px)}
  50%{clip-path:inset(0 0 72% 0);transform:translateX(-6px)}75%{clip-path:inset(28% 0 26% 0);transform:translateX(4px)}100%{clip-path:inset(0);transform:none}}
@media (prefers-reduced-motion:reduce){.node.open::after{animation:none;opacity:.6;transform:none}#planet.glitch-in,#map.glitching .panel,#map.glitching .back,#map.glitching .map-step{animation:none;text-shadow:none}}
</style>
</head>
<body class="home">
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="ink" x="-5%" y="-20%" width="110%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G" result="d"/>
    <feGaussianBlur in="d" stdDeviation="0.3"/>
  </filter>
</svg>

<canvas id="scene" aria-hidden="true"></canvas>

<div id="stage">
  <section class="screen" id="main" aria-label="메인">
    <nav class="menu">
      <button class="primary ink" data-go="map" data-text="시작"></button>
      <button class="sub ink" data-go="lore" data-text="세계관"></button>
      <button class="sub ink" data-go="settings" data-text="설정"></button>
    </nav>
  </section>

  <section class="screen" id="lore" aria-label="세계관">
    <div class="page">
      <h2 class="ink" data-text="세계관"></h2>
      <div class="scroll" id="loreList"></div>
      <button class="back ink" data-go="main">돌아가기</button>
    </div>
  </section>

  <section class="screen" id="settings" aria-label="설정">
    <div class="page">
      <h2 class="ink" data-text="설정"></h2>
      <div class="scroll" id="settingsBody"></div>
      <button class="back ink" data-go="main">돌아가기</button>
    </div>
  </section>
</div>

<script>
"use strict";
/* ════════════════════════════════════════════════

const NOTICES = [

    "메인 화면 배경에 혜성이 떨어지는 하늘과, 손에 든 캠코더처럼 움직이는 화면 연출을 넣었습니다.",

/* 행성. rule: 'loop' = 시간여행 시 같은 타임라인에서 루프, 'branch' = 새 타임라인으로 분기 */
const PLANETS = [
  { id: 1, alias: "제 1 행성", name: "차원의 틈 : 120 - 494 - 159 - ACU - 추락하는 불빛", rule: "loop", lore: "planet-1" },
  { id: 2, alias: null, name: null, rule: "branch", lore: "planet-2" },
  { id: 3, alias: null, name: null, rule: "branch", lore: "planet-3" },
  { id: 4, alias: null, name: null, rule: "branch", lore: "planet-4" },
  { id: 5, alias: null, name: null, rule: "branch", lore: "planet-5" },
  { id: 6, alias: null, name: null, rule: "branch", lore: "planet-6" },
  { id: 7, alias: null, name: null, rule: "branch", lore: "planet-7" }
];

/* 세계관 항목: 스토리에서 unlock 되어야만 보인다 */
const LORE = {
  "planet-1": {
    title: "차원의 틈 : 120 - 494 - 159 - ACU - 추락하는 불빛", alias: "제 1 행성",
    body: [
      "추락하는 불빛 인원들이 살고있는 행성이다.",
      "이 행성의 특징은 “타임라인” 에 영향을 받지 않는 다는 것이다."
    ]
  },
  "timeline": {
    title: "타임라인", alias: "Timeline",
    body: [
      "제 1 타임라인, 우리가 살고있는 현실을 말한다.",
      "이 타임라인에서 제 2 타임라인으로 시간여행을 할 경우, 전부 되돌아가고, 운명법칙에 따라 그곳은 완전히 다른 세계가 되어버린다.",
      "하지만, 제 1 행성은 다르다. 시간여행을 할 지라도 제 2 타임라인으로 가지지 않고 일정한 시간선에서 계속 타임 루프를 하게된다."
    ]
  }
};

/* ════════════════════════════════════════════════
   저장소 (실패해도 앱은 돌아간다)
   ════════════════════════════════════════════════ */
const Store = {
  get(k, d) { try { const v = localStorage.getItem("fall-lux:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("fall-lux:" + k, JSON.stringify(v)); } catch (e) {} }
};
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const Settings = Object.assign({ textSpeed: "normal", shake: REDUCED ? "off" : "large" }, Store.get("settings", {}));
const saveSettings = () => Store.set("settings", Settings);

/* ════════════════════════════════════════════════
   타임라인 = 행성별 세이브 파일
   ════════════════════════════════════════════════ */
const Timeline = {
  _all() { return Store.get("timelines", {}); },
  _put(all) { Store.set("timelines", all); },
  list(planetId) { return (this._all()[planetId] || []).slice(); },
  create(planetId, state = {}) {
    const all = this._all(), arr = all[planetId] || (all[planetId] = []);
    const index = arr.reduce((m, t) => Math.max(m, t.index), 0) + 1;
    const tl = { id: planetId + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), planet: planetId, index,
      node: state.node || null, choices: state.choices || [], flags: state.flags || {}, loop: 0,
      createdAt: Date.now(), updatedAt: Date.now() };
    arr.push(tl); this._put(all); return tl;
  },
  load(planetId, id) { return this.list(planetId).find(t => t.id === id) || null; },
  save(planetId, id, patch) {
    const all = this._all(), arr = all[planetId] || [], t = arr.find(x => x.id === id);
    if (!t) return null;
    Object.assign(t, patch, { updatedAt: Date.now() }); this._put(all); return t;
  },
  remove(planetId, id) {
    const all = this._all(); all[planetId] = (all[planetId] || []).filter(t => t.id !== id); this._put(all);
  },
  /* 시간여행: 제 1 행성은 같은 타임라인 안에서 루프, 그 외에는 새 타임라인(완전히 다른 세계)으로 분기 */
  timeTravel(planetId, id, toNode) {
    const p = PLANETS.find(x => x.id === planetId), cur = this.load(planetId, id);
    if (!p || !cur) return null;
    if (p.rule === "loop") return this.save(planetId, id, { node: toNode, loop: cur.loop + 1 });
    return this.create(planetId, { node: toNode });
  }
};
const Lore = {
  unlocked() { return Store.get("lore", []); },
  unlock(key) { const u = this.unlocked(); if (LORE[key] && !u.includes(key)) { u.push(key); Store.set("lore", u); } }
};
window.FallLux = { timeline: Timeline, lore: Lore, planets: PLANETS };

/* ════════════════════════════════════════════════
   글자 애니메이션
   ════════════════════════════════════════════════ */
const STEP = { slow: 110, normal: 60, fast: 30 };
function typeset(el, text, base) {
  el.textContent = "";
  el.style.setProperty("--step", STEP[Settings.textSpeed] + "ms");
  el.style.setProperty("--base", base + "ms");
  [...text].forEach((c, i) => {
    const s = document.createElement("span");
    s.className = "ch" + (c === " " ? " sp" : "");
    s.textContent = c === " " ? " " : c;
    s.style.setProperty("--i", i);
    s.setAttribute("aria-hidden", "true");
    el.appendChild(s);
  });
  el.setAttribute("aria-label", text);
}
function typesetAll(root, base) {
  let t = base;
  root.querySelectorAll("[data-text]").forEach(el => {
    typeset(el, el.dataset.text, t);
    t += Math.min([...el.dataset.text].length * STEP[Settings.textSpeed] * 0.5, 800) + 60;
  });
}
function el(tag, text, cls) {
  const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.dataset.text = text; return e;
}

/* ════════════════════════════════════════════════
   화면 전환
   ════════════════════════════════════════════════ */
let current = null;
function go(name, push = true) {
  if (name === current) return;
  document.body.classList.toggle("home", name === "main");
  const layerOn = name === "map" || name === "planet";
  document.getElementById("map").hidden = name !== "map";
  document.getElementById("planet").hidden = name !== "planet";
  if (name !== "map" && Map3D.ready()) Map3D.get().stop();
  if (name !== "planet") Story.close();
  if (layerOn) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("on"));
    Scene.halt();
    if (name === "map") Map3D.show();
    if (name === "planet") Story.show();
    current = name;
    if (push) history.pushState({ s: name }, "");
    return;
  }
  Scene.setExposure(name === "main" ? 1 : 0.42);
  if (name === "lore") renderLore();
  if (name === "settings") renderSettings();
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === name));
  typesetAll(document.getElementById(name), 200);
  current = name;
  if (push && name !== "main") history.pushState({ s: name }, "");
  const focusTarget = document.querySelector("#" + name + " h2, #" + name + " .primary");
  if (focusTarget && name !== "main") { focusTarget.tabIndex = -1; focusTarget.focus({ preventScroll: true }); }
}

/* ════════════════════════════════════════════════
   행성 지도 (3D)
   ════════════════════════════════════════════════ */
const Map3D = (() => {
  let map = null, body = null;
  const $ = id => document.getElementById(id);
  function fill(b) {
    body = b;
    const i = b.info;
    if (b.lore) Lore.unlock(b.lore);                 // 지도에서 본 설정은 세계관에 기록된다
    $("biKind").dataset.text = i.label;
    $("biName").dataset.text = i.name;
    $("biFull").textContent = i.fullName || ""; $("biFull").hidden = !i.fullName;
    $("biLoc").textContent = i.location;
    $("biDesc").textContent = i.desc.join(" ");
    $("biExt").textContent = i.exterior;
    const enter = $("biEnter");
    const canEnter = b.kind === "planet" || b.kind === "moon" || b.kind === "blackhole";
    enter.hidden = !canEnter;
    enter.textContent = b.locked ? "봉인됨" : "입장";
    enter.setAttribute("aria-disabled", String(!!b.locked));
    $("bodyInfo").hidden = false; $("mapHint").classList.add("off");
    typesetAll($("bodyInfo"), 150);
  }
  function close() { $("bodyInfo").hidden = true; body = null; }
  function init() {
    map = FallApp3D.createMap($("mapGL"), { onSelect: fill, onDeselect: close });
    document.querySelectorAll("[data-step]").forEach(b => b.onclick = () => map.step(+b.dataset.step));
    $("biClose").onclick = () => map.deselect();
    $("biEnter").onclick = () => {
      if (!body || body.locked || body.kind !== "planet") return;
      const pid = body.planetId;
      $("map").classList.add("glitching");
      map.runGlitch(280, () => { $("map").classList.remove("glitching"); Story.planet = pid; go("planet"); });
    };
  }
  return {
    ready: () => !!map, get: () => map,
    show() {
      if (!window.FallApp3D) return;
      if (!map) init();
      map.start();
    },
    deselect() { if (map && map.selectedId()) { map.deselect(); return true; } return false; }
  };
})();

/* ════════════════════════════════════════════════
   행성 안: 이야기 지도
   ════════════════════════════════════════════════ */
const Story = (() => {
  let sm = null, tl = null, openNode = null;
  const $ = id => document.getElementById(id);
  function timeline(pid) {
    const list = Timeline.list(pid).sort((a, b) => b.updatedAt - a.updatedAt);
    return list[0] || Timeline.create(pid, {});
  }
  function closePanel() { $("nodePanel").hidden = true; openNode = null; }
  function openPanel(n, st, data) {
    openNode = n;
    const L = FallApp3D.TYPE_LABEL;
    $("npKind").dataset.text = L[n.type];
    $("npTitle").dataset.text = n.title || "???";
    const lines = [];
    if (n.type !== "star") lines.push(n.body || "아직 작성되지 않은 이야기입니다.");
    if (n.type !== "book") lines.push("전투 · 탐색이 아직 준비되지 않았습니다.");
    $("npBody").textContent = st === "done" ? "이미 지나온 갈림목입니다." : lines.join(" ");
    const acts = $("npActs"); acts.innerHTML = "";
    const btn = (text, cls, fn) => { const b = document.createElement("button"); b.type = "button"; b.className = cls; b.textContent = text; b.onclick = fn; acts.appendChild(b); return b; };
    if (st !== "done") {
      if (n.next.length > 1) {
        n.next.forEach((id, k) => {
          const t = data.nodes.find(x => x.id === id);
          btn(`갈래 ${k + 1} · ${L[t.type]}`, "go ink", () => { sm.complete(n.id, id); closePanel(); });
        });
      } else {
        btn("다음으로", "go ink", () => { sm.complete(n.id); closePanel(); });
      }
    }
    btn("닫기", "quiet", closePanel);
    $("nodePanel").hidden = false;
    typesetAll($("nodePanel"), 100);
  }
  return {
    planet: 1,
    show() {
      if (!window.FallApp3D) return;
      if (!sm) sm = FallApp3D.createStoryMap($("storyRoot"), {
        onOpen: openPanel,
        onSave: st => { if (tl) Timeline.save(this.planet, tl.id, { flags: Object.assign({}, tl.flags, { story: st }), node: st.done[st.done.length - 1] || null }); }
      });
      tl = timeline(this.planet);
      closePanel();
      const layer = $("planet");
      layer.classList.remove("glitch-in"); void layer.offsetWidth; layer.classList.add("glitch-in");
      sm.open(this.planet, (tl.flags && tl.flags.story) || null);
    },
    close() { if (sm) sm.close(); closePanel(); },
    closePanel, isPanelOpen: () => !$("nodePanel").hidden
  };
})();document.addEventListener("click", e => {
  const b = e.target.closest("[data-go]");
  if (!b) return;
  if ((b.dataset.go === "main" || (b.dataset.go === "map" && current === "planet")) && history.state && history.state.s) { history.back(); return; }
  go(b.dataset.go);
});
addEventListener("popstate", e => go((e.state && e.state.s) || "main", false));
addEventListener("keydown", e => {
  if (e.key !== "Escape" || current === "main") return;
  if (current === "map" && Map3D.deselect()) return;
  if (current === "planet" && Story.isPanelOpen()) { Story.closePanel(); return; }
  history.back();
});

/* ── 세계관 ── */
function renderLore() {
  const box = document.getElementById("loreList"); box.innerHTML = "";
  const keys = Lore.unlocked().filter(k => LORE[k]);
  if (!keys.length) { box.appendChild(el("p", "아직 기록된 설정이 없다.", "empty")); return; }
  keys.forEach(k => {
    const d = LORE[k], art = el("article", null, "entry");
    art.appendChild(el("h3", d.title));
    if (d.alias) art.appendChild(el("div", d.alias, "alias"));
    d.body.forEach(t => art.appendChild(el("p", t)));
    box.appendChild(art);
  });
}

/* ── 설정 ── */
function optionRow(label, key, opts) {
  const row = el("div", null, "row");
  const id = "lbl-" + key;
  const l = el("span", label, "label"); l.id = id; row.appendChild(l);
  row.setAttribute("role", "group"); row.setAttribute("aria-labelledby", id);
  opts.forEach(([v, t]) => {
    const b = document.createElement("button"); b.className = "opt"; b.textContent = t;
    b.setAttribute("aria-pressed", String(Settings[key] === v));
    b.onclick = () => {
      Settings[key] = v; saveSettings();
      row.querySelectorAll(".opt").forEach(o => o.setAttribute("aria-pressed", String(o === b)));
      if (key === "shake") Cam.setMode(v);
    };
    row.appendChild(b);
  });
  return row;
}
function renderSettings() {
  const box = document.getElementById("settingsBody"); box.innerHTML = "";

  const g1 = el("div", null, "group");
  g1.appendChild(el("h4", "Reading"));
  g1.appendChild(optionRow("글자 속도", "textSpeed", [["slow", "느리게"], ["normal", "보통"], ["fast", "빠르게"]]));
  g1.appendChild(optionRow("화면 흔들림", "shake", [["large", "크게"], ["small", "작게"], ["off", "끄기"]]));
  box.appendChild(g1);

  const g2 = el("div", null, "group");
  g2.appendChild(el("h4", "Timeline"));
  const known = Lore.unlocked();
  PLANETS.forEach(p => {
    const wrap = el("div", null, "planet");
    const nm = el("div", null, "pname");
    const num = el("span", null, "pnum"); num.textContent = String(p.id).padStart(2, "0"); nm.appendChild(num);
    const shown = known.includes(p.lore) && p.alias ? p.alias : "???";
    nm.appendChild(document.createTextNode(shown));
    nm.setAttribute("aria-label", "행성 " + p.id + (shown === "???" ? ", 아직 알 수 없음" : ", " + shown));
    wrap.appendChild(nm);
    const tls = Timeline.list(p.id);
    if (!tls.length) { const t = el("div", null, "tl"); t.textContent = "기록된 타임라인 없음"; wrap.appendChild(t); }
    tls.forEach(tl => {
      const t = el("div", null, "tl");
      const d = new Date(tl.updatedAt);
      const label = "제 " + tl.index + " 타임라인" + (p.rule === "loop" && tl.loop ? " · 루프 " + tl.loop : "") +
        " · " + d.getFullYear() + "." + (d.getMonth() + 1) + "." + d.getDate();
      const span = document.createElement("span"); span.textContent = label; t.appendChild(span);
      const del = document.createElement("button"); del.textContent = "지우기";
      del.setAttribute("aria-label", "행성 " + p.id + " 제 " + tl.index + " 타임라인 지우기");
      del.onclick = () => { if (confirm("이 타임라인을 지울까요? 되돌릴 수 없습니다.")) { Timeline.remove(p.id, tl.id); renderSettings(); } };
      t.appendChild(del); wrap.appendChild(t);
    });
    g2.appendChild(wrap);
  });
  box.appendChild(g2);

  const g3 = el("div", null, "group");
  g3.appendChild(el("h4", "Notice"));
  NOTICES.forEach(n => {
    const a = el("article", null, "notice");
    a.appendChild(el("h5", n.name));
    const tm = document.createElement("time"); tm.textContent = n.date; tm.dateTime = n.date; a.appendChild(tm);
    const ul = document.createElement("ul"); n.items.forEach(i => { const li = document.createElement("li"); li.textContent = i; ul.appendChild(li); });
    a.appendChild(ul);
    g3.appendChild(a);
  });
  box.appendChild(g3);
  typesetAll(box, 0);

/* ════════════════════════════════════════════════
   캠코더: 사람이 손에 들고 찍는 화면
   느리고 큰 흔들림 ↔ 작은 흔들림 ↔ 거의 멈춤이 무작위로 오간다
   ════════════════════════════════════════════════ */
const Cam = (() => {
  const stage = document.getElementById("stage"), pose = { x: 0, y: 0, r: 0, z: 1 };
  function noise1(seed) {
    const vals = Array.from({ length: 256 }, () => Math.random() * 2 - 1);
    return x => {
      const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
      const a = vals[(i + seed) & 255], b = vals[(i + seed + 1) & 255];
      return a + (b - a) * u;
    };
  }
  const nx = noise1(11), ny = noise1(97), nr = noise1(173), nz = noise1(41), jx = noise1(5), jy = noise1(201);
  const MODES = { large: 1, small: 0.35, off: 0 };
  let modeMul = MODES[Settings.shake] ?? 1, env = 0.5, envTarget = 0.8, envTimer = 0, t = Math.random() * 100;
  function tick(dt) {
    t += dt; envTimer -= dt;
    if (envTimer <= 0) {
      const r = Math.random();
      envTarget = r < 0.4 ? 1 : r < 0.75 ? 0.45 : 0.12;   // 크게 / 보통 / 거의 멈춤
      envTimer = 3 + Math.random() * 6;
    }
    env += (envTarget - env) * Math.min(1, dt * 0.45);
    if (!modeMul) { pose.x = pose.y = pose.r = 0; pose.z = 1; return pose; }
    const k = env * modeMul, m = Math.min(innerWidth, innerHeight), sp = 0.22;
    pose.x = (nx(t * sp) * 0.75 + nx(t * sp * 2.3 + 40) * 0.25) * m * 0.032 * k + jx(t * 1.7) * 1.4 * k;
    pose.y = (ny(t * sp * 0.9) * 0.75 + ny(t * sp * 2.1 + 80) * 0.25) * m * 0.026 * k + jy(t * 1.9) * 1.2 * k;
    pose.r = nr(t * sp * 0.8) * 1.3 * k;
    pose.z = 1.1 + nz(t * 0.07) * 0.018 * Math.max(k, 0.3);
    stage.style.transform = `translate3d(${pose.x.toFixed(2)}px,${pose.y.toFixed(2)}px,0) rotate(${pose.r.toFixed(3)}deg)`;
    return pose;
  }
  return { tick, setMode(m) { modeMul = MODES[m] ?? 1; if (!modeMul) stage.style.transform = "none"; } };
})();

/* ════════════════════════════════════════════════
   장면: 블러된 하늘색 · 노란 불빛의 우주 + 떨어지는 불빛(혜성)
   - 색과 혜성 연출은 '추락하는 불빛 위키'를 따른다: 하늘색 #4cc9ff / 노랑 #ffd84a, 흰 머리, 빛 연기, 불티
   - 하늘은 작은 캔버스에 한 번만 그려 두고 늘려서 쓴다(그 자체로 초점이 나간 하늘)
   - 큰 불빛이 지나가면 주변 하늘이 그 색으로 물든다 (이 화면의 시그니처)
   - 노출: 메인 1, 읽는 화면 0.42, 시작 0
   ════════════════════════════════════════════════ */
const Scene = (() => {
  const cv = document.getElementById("scene"), ctx = cv.getContext("2d");
  const sky = document.createElement("canvas"), sctx = sky.getContext("2d");
  const rnd = (a, b) => a + Math.random() * (b - a);
  const COL = { b: "76,201,255", y: "255,216,74" };
  /* 빛 연기 한 알갱이 = 미리 그려 둔 작은 빛 덩어리 */
  const SPR = {};
  for (const k in COL) {
    const c = document.createElement("canvas"); c.width = c.height = 64;
    const g = c.getContext("2d"), r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    r.addColorStop(0, "rgba(255,255,255,.95)"); r.addColorStop(.25, `rgba(${COL[k]},.55)`);
    r.addColorStop(.6, `rgba(${COL[k]},.14)`); r.addColorStop(1, `rgba(${COL[k]},0)`);
    g.fillStyle = r; g.fillRect(0, 0, 64, 64); SPR[k] = c;
  }
  /* 품질 단계: 30fps 밑으로 내려가지 않도록 단계를 낮추고, 여유가 생기면 올린다 */
  const TIERS = [
    { dpr: 0.6, small: 1, parts: 120, stars: 2, leak: false, grain: false },
    { dpr: 0.85, small: 2, parts: 300, stars: 1, leak: false, grain: false },
    { dpr: 1.15, small: 3, parts: 600, stars: 1, leak: true, grain: true },
    { dpr: 1.5, small: 4, parts: 1000, stars: 1, leak: true, grain: true }
  ];
  let tier = 3, W = 0, H = 0, K = 1, dpr = 1, stars = [], C = [], PL = [], SP = [];
  let exposure = 1, expTarget = 1, raf = 0, last = 0, running = false, tint = { b: 0, y: 0 };
  const SLOW = REDUCED ? 1.7 : 1;

  function paintSky() {
    const w = Math.max(64, Math.round(W * 0.25)), h = Math.max(64, Math.round(H * 0.25));
    sky.width = w; sky.height = h;
    const g = sctx.createLinearGradient(0, 0, 0, h);
    [[0, "#0b0d13"], [0.5, "#14161a"], [1, "#1d1b13"]].forEach(([o, c]) => g.addColorStop(o, c));
    sctx.fillStyle = g; sctx.fillRect(0, 0, w, h);
    /* 성운: 왼쪽 아래 하늘색, 오른쪽 위 노랑, 아래로 깔리는 노란 그라데이션, 가운데 회청색 */
    [[0.18, 0.85, 0.75, COL.b, 0.2], [0.88, 0.1, 0.62, COL.y, 0.14], [0.62, 1.08, 0.8, COL.y, 0.16], [0.55, 0.5, 0.55, "90,100,130", 0.22]]
      .forEach(([x, y, r, c, a]) => {
        const rg = sctx.createRadialGradient(x * w, y * h, 0, x * w, y * h, r * Math.max(w, h));
        rg.addColorStop(0, `rgba(${c},${a})`); rg.addColorStop(1, `rgba(${c},0)`);   // 같은 색의 투명으로 (검정 투명은 회색을 거친다)
        sctx.fillStyle = rg; sctx.fillRect(0, 0, w, h);
      });
    const tmp = document.createElement("canvas"); tmp.width = w; tmp.height = h;
    const tc = tmp.getContext("2d"); tc.filter = "blur(2px)"; tc.drawImage(sky, 0, 0);
    sctx.drawImage(tmp, 0, 0);
  }
  function makeStars() {
    /* 균일하게 흩어진 별. 덩어리지지 않도록 격자 칸마다 최대 하나 */
    stars = [];
    const cell = 70, cols = Math.ceil(W / cell), rows = Math.ceil(H / cell);
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      if (Math.random() < 0.4) continue;
      stars.push({ x: (x + Math.random()) * cell, y: (y + Math.random()) * cell, r: 0.3 + Math.random() * 1.1,
        ph: Math.random() * 6.28, sp: 0.5 + Math.random() * 2, d: 0.15 + Math.random() * 0.85 });
    }
  }
  let lw = 0, lh = 0;
  function resize() {
    W = innerWidth; H = innerHeight;
    dpr = Math.min(devicePixelRatio || 1, TIERS[tier].dpr);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    K = Math.max(0.55, Math.min(1.4, Math.min(W, H) / 520));
    if (W !== lw || H !== lh) { paintSky(); makeStars(); lw = W; lh = H; }
    document.body.classList.toggle("lowfx", !TIERS[tier].grain);
  }

  /* 불빛 하나: 큰 불빛(hero)은 하늘색으로 천천히, 작은 불빛은 하늘색·노랑이 섞여 빠르게 */
  function spawn(hero, prog) {
    const dur = (hero ? rnd(7.5, 9.5) : rnd(3, 5)) * SLOW;
    const sx = hero ? W * rnd(0.72, 0.92) : W * rnd(0.3, 1.1), sy = -H * 0.12;
    const ex = hero ? W * rnd(0.1, 0.3) : sx - W * rnd(0.35, 0.7), ey = H * 1.1;
    const dx = ex - sx, dy = ey - sy, m = Math.hypot(dx, dy);
    return { hero, s: hero ? 7 : rnd(2, 4), c: hero ? "b" : (Math.random() < 0.5 ? "b" : "y"), sx, sy, ex, ey, dur,
      t: (prog || 0) * dur, dx: dx / m, dy: dy / m, ph: Math.random() * 6.28, cs: Math.random() < 0.5 ? 1 : -1,
      wait: 0, px: null, py: null, x: sx, y: sy, f: 0 };
  }
  function fillComets() {
    const want = 1 + (REDUCED ? 1 : TIERS[tier].small);
    while (C.length < want) C.push(C.length ? spawn(false, Math.random() * 0.8) : spawn(true, 0.1));
    if (C.length > want) C.length = want;
  }
  const fade = k => k < 0.04 ? k / 0.04 : k > 0.72 ? Math.max(0, 1 - (k - 0.72) / 0.26) : 1;

  function emit(c, dt) {
    const sz = c.s * K;
    if (c.px == null) { c.px = c.x; c.py = c.y; }
    const cap = TIERS[tier].parts * (REDUCED ? 0.4 : 1);
    const dist = Math.hypot(c.x - c.px, c.y - c.py), n = Math.min(14, Math.ceil(dist / (sz * 0.45)));
    const bx = -c.dx, by = -c.dy, px = -by, py = bx;
    for (let i = 0; i < n && PL.length < cap; i++) {
      const u = (i + 1) / n, x = c.px + (c.x - c.px) * u, y = c.py + (c.y - c.py) * u;
      const life = rnd(900, 1700) * (c.hero ? 1.25 : 1), dr = rnd(0.01, 0.045) * K;
      PL.push({ x: x + px * rnd(-1, 1) * sz * 0.3, y: y + py * rnd(-1, 1) * sz * 0.3, vx: bx * dr + px * rnd(-1, 1) * 0.008 * K,
        vy: by * dr + py * rnd(-1, 1) * 0.008 * K, l: life, m: life, r0: sz * rnd(0.7, 1.3), r1: sz * rnd(2.6, 5.2) * (c.hero ? 1.2 : 1), c: c.c, a: 0.2 * c.f });
      if (Math.random() < 0.35) {                   // 반대 색 연기가 살짝 섞인다
        const l2 = rnd(1300, 2400) * (c.hero ? 1.2 : 1);
        PL.push({ x, y, vx: bx * rnd(0.004, 0.02) * K + px * c.cs * 0.01 * K, vy: by * rnd(0.004, 0.02) * K + py * c.cs * 0.01 * K,
          l: l2, m: l2, r0: sz * 1.4, r1: sz * rnd(5, 8), c: c.c === "b" ? "y" : "b", a: 0.1 * c.f });
      }
    }
    const sn = (c.hero ? 2 : 1) * Math.min(3, Math.max(1, Math.round(dt / 16)));
    for (let i = 0; i < sn && SP.length < cap / 3; i++) {        // 불티
      if (Math.random() < (c.hero ? 0.9 : 0.5)) {
        const sp = rnd(0.03, 0.14) * K, pa = rnd(-1, 1) * 0.7;
        SP.push({ x: c.x + rnd(-2, 2), y: c.y + rnd(-2, 2), vx: (bx * Math.cos(pa) - by * Math.sin(pa)) * sp,
          vy: (bx * Math.sin(pa) + by * Math.cos(pa)) * sp + 0.01, l: rnd(500, 1300), m: 1300, r: rnd(0.5, 1.6) * K,
          c: Math.random() < 0.55 ? COL[c.c] : "255,245,220" });
      }
    }
    c.px = c.x; c.py = c.y;
  }

  function step(ms) {
    for (const c of C) {
      if (c.wait > 0) { c.wait -= ms; if (c.wait <= 0) Object.assign(c, spawn(c.hero, 0)); continue; }
      c.t += ms / 1000;
      const k = Math.min(1, c.t / c.dur), e = Math.pow(k, 1.18);
      c.x = c.sx + (c.ex - c.sx) * e; c.y = c.sy + (c.ey - c.sy) * e; c.f = fade(k);
      if (c.f > 0.01) emit(c, ms);
      if (k >= 1) { c.f = 0; c.wait = c.hero ? rnd(1200, 2600) : rnd(300, 2000); c.px = null; }
    }
    for (let i = PL.length - 1; i >= 0; i--) { const p = PL[i]; p.l -= ms; p.x += p.vx * ms; p.y += p.vy * ms; if (p.l <= 0) PL.splice(i, 1); }
    for (let i = SP.length - 1; i >= 0; i--) { const p = SP[i]; p.l -= ms; p.x += p.vx * ms; p.y += p.vy * ms; p.vx *= 0.993; p.vy *= 0.993; if (p.l <= 0) SP.splice(i, 1); }
  }

  function draw(now) {
    const T = TIERS[tier];
    ctx.globalCompositeOperation = "source-over";
    ctx.drawImage(sky, -2, -2, W + 4, H + 4);
    /* 시그니처: 큰 불빛이 지나가는 동안 하늘이 그 색으로 물든다 */
    for (const k in tint) if (tint[k] > 0.01) {
      const hc = C.find(c => c.hero && c.c === k && c.f > 0.01);
      const cx = hc ? hc.x : W * 0.5, cy = hc ? hc.y : H * 0.5, R = Math.max(W, H) * 0.8;
      const lg = ctx.createRadialGradient(cx, cy, 0, cx, cy, R);
      lg.addColorStop(0, `rgba(${COL[k]},${0.12 * tint[k]})`); lg.addColorStop(1, `rgba(${COL[k]},0)`);
      ctx.fillStyle = lg; ctx.fillRect(0, 0, W, H);
    }
    ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < stars.length; i += T.stars) {   // 가장 낮은 단계에서는 별을 절반만
      const s = stars[i], a = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(now * s.sp + s.ph));
      ctx.fillStyle = `rgba(235,242,255,${a * s.d * 0.8})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r * K, 0, 6.283); ctx.fill();
    }
    if (T.leak) {                                       // 라이트 릭: 오른쪽 위 가장자리에서 천천히 숨쉬는 노란 빛
      const a = 0.05 + 0.035 * Math.sin(now * 0.21), R = Math.max(W, H) * 0.7;
      const lg = ctx.createRadialGradient(W * 1.02, -H * 0.05, 0, W * 1.02, -H * 0.05, R);
      lg.addColorStop(0, `rgba(${COL.y},${a})`); lg.addColorStop(1, `rgba(${COL.y},0)`);
      ctx.fillStyle = lg; ctx.fillRect(0, 0, W, H);
    }
    for (const p of PL) {
      const u = 1 - p.l / p.m, a = p.a * (1 - u) * (1 - u), r = p.r0 + (p.r1 - p.r0) * u;
      if (a < 0.005) continue;
      ctx.globalAlpha = a; ctx.drawImage(SPR[p.c], p.x - r, p.y - r, r * 2, r * 2);
    }
    ctx.globalAlpha = 1;
    for (const p of SP) {
      const a = Math.max(0, p.l / p.m);
      ctx.fillStyle = `rgba(${p.c},${a * 0.95})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.4 + 0.6 * a), 0, 6.283); ctx.fill();
    }
    for (const c of C) {
      if (c.f <= 0.01) continue;
      const sz = c.s * K, f = c.f, prim = COL[c.c], bx = -c.dx, by = -c.dy, px = -by, py = bx, len = sz * (c.hero ? 16 : 11);
      const ex = c.x + bx * len, ey = c.y + by * len, g = ctx.createLinearGradient(c.x, c.y, ex, ey);
      g.addColorStop(0, `rgba(255,255,255,${0.95 * f})`); g.addColorStop(0.3, `rgba(${prim},${0.55 * f})`); g.addColorStop(1, `rgba(${prim},0)`);
      ctx.fillStyle = g; ctx.beginPath();
      ctx.moveTo(c.x + px * sz * 0.5, c.y + py * sz * 0.5); ctx.lineTo(ex + px * sz * 0.12, ey + py * sz * 0.12);
      ctx.lineTo(ex - px * sz * 0.12, ey - py * sz * 0.12); ctx.lineTo(c.x - px * sz * 0.5, c.y - py * sz * 0.5);
      ctx.closePath(); ctx.fill();
      const fl = 0.88 + 0.12 * Math.sin(now * 18 + c.ph) * Math.sin(now * 27), R = sz * 8 * fl;
      const g2 = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, R);
      g2.addColorStop(0, `rgba(255,255,255,${0.9 * f})`); g2.addColorStop(0.2, `rgba(${prim},${0.5 * f})`);
      g2.addColorStop(0.55, `rgba(${prim},${0.12 * f})`); g2.addColorStop(1, `rgba(${prim},0)`);
      ctx.fillStyle = g2; ctx.beginPath(); ctx.arc(c.x, c.y, R, 0, 6.283); ctx.fill();
      ctx.fillStyle = `rgba(255,255,255,${f})`; ctx.beginPath(); ctx.arc(c.x, c.y, sz * 0.55 * fl, 0, 6.283); ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";
  }

  let acc = 0, frames = 0, goodFor = 0;
  function watch(dt) {
    acc += dt; frames++;
    if (acc < 1.5) return;
    const fps = frames / acc; acc = 0; frames = 0;
    if (fps < 40 && tier > 0) { tier--; goodFor = 0; resize(); fillComets(); }
    else if (fps > 57) { goodFor += 1.5; if (goodFor >= 6 && tier < TIERS.length - 1) { tier++; goodFor = 0; resize(); fillComets(); } }
    else goodFor = 0;
  }

  function frame(t) {
    raf = requestAnimationFrame(frame);
    const raw = (t - last) / 1000 || 0.016, dt = Math.min(0.05, raw); last = t;
    watch(raw);                                          // 품질 판단은 잘리지 않은 실제 시간으로
    exposure += (expTarget - exposure) * Math.min(1, dt * 1.6);
    if (expTarget === 0 && exposure < 0.01) { stop(); return; }
    const p = Cam.tick(dt);
    step(dt * 1000);
    for (const k in tint) {
      const on = C.some(c => c.hero && c.c === k && c.f > 0.01) ? 1 : 0;
      tint[k] += (on - tint[k]) * Math.min(1, dt * 0.8);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.translate(W / 2 + p.x, H / 2 + p.y); ctx.rotate(p.r * Math.PI / 180); ctx.scale(p.z, p.z); ctx.translate(-W / 2, -H / 2);
    draw(t / 1000);
    if (exposure < 0.999) {                             // 노출: 읽는 화면에서는 하늘을 어둡게
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = `rgba(12,14,19,${(1 - exposure).toFixed(3)})`; ctx.fillRect(0, 0, cv.width, cv.height);
    }
  }
  function start() { if (running) return; running = true; last = performance.now(); raf = requestAnimationFrame(frame); }
  function stop() { running = false; cancelAnimationFrame(raf); }

  addEventListener("resize", resize);
  document.addEventListener("visibilitychange", () => { if (document.hidden) stop(); else if (expTarget > 0) start(); });
  resize(); fillComets(); start();
  return {
    setExposure(v) { expTarget = v; if (v > 0) start(); },
    halt() { expTarget = 0; exposure = 0; stop(); },     // 3D 화면이 덮을 때는 바로 멈춘다
    tier() { return tier; }
  };
})();

/* 필름 그레인 */
(() => {
  const c = document.createElement("canvas"); c.width = c.height = 160;
  const x = c.getContext("2d"), d = x.createImageData(160, 160);
  for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  x.putImageData(d, 0, 0);
  document.getElementById("grain").style.backgroundImage = `url(${c.toDataURL()})`;
})();

/* ════════════════════════════════════════════════
   시작
   ════════════════════════════════════════════════ */
document.getElementById("mark").textContent = NOTICES[0].name;
history.replaceState({ s: null }, "");
Promise.race([
  document.fonts ? Promise.all([document.fonts.load('40px "Song Myung"', "시작세계관설정"), document.fonts.load('16px "IM Fell English"', "Patch")]) : Promise.resolve(),
  new Promise(r => setTimeout(r, 2000))
]).catch(() => {}).then(() => go("main", false));
/* 안드로이드 뒤로가기 (Capacitor) */
try {
  const App = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
  if (App) App.addListener("backButton", () => { if (current !== "main") history.back(); else App.exitApp(); });
} catch (e) {}
</script>
